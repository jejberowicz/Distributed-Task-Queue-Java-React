spring:
  application:
    name: inferqueue
  # Al recibir SIGTERM deja de aceptar requests nuevos y espera a que terminen los
  # que están en curso. Sin esto, el rolling update de Kubernetes corta respuestas
  # a mitad de camino. El timeout tiene que quedar por debajo del
  # terminationGracePeriodSeconds del pod, o el SIGKILL llega primero.
  lifecycle:
    timeout-per-shutdown-phase: 40s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inferqueue}
    username: ${DB_USER:inferqueue}
    password: ${DB_PASSWORD:inferqueue}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      # Habilita /actuator/health/liveness y /readiness. Boot los prende solo si
      # detecta que corre en Kubernetes, pero explícito es mejor: así las mismas
      # URLs responden en compose y en local, y las probes no dependen de que la
      # autodetección acierte.
      probes:
        enabled: true

inferqueue:
  queue:
    streams:
      priority: infer:priority
      standard: infer:standard
    dlq-stream: infer:dlq
    consumer-group: inferqueue-workers
    # Un job sin XACK por más de este tiempo se considera huérfano (worker muerto)
    # y es reclamado con XCLAIM por otro worker.
    claim-idle-timeout: 60s
    # En formato ISO-8601 porque además de bindearse como Duration alimenta el
    # fixedDelayString de @Scheduled, que sólo acepta ISO-8601 o un número plano.
    reclaim-interval: PT15S
    # Cuántos mensajes reclama como máximo cada pasada del reclaimer.
    reclaim-batch-size: 32
    max-retries: 3
    # Backoff exponencial: base * 2^(retryCount)
    retry-backoff-base: 2s
    retry-backoff-max: 5m
    default-ttl: 30m
    retention:
      # Muy por encima del backlog esperable: si un stream llega acá, el problema
      # es que los workers no dan abasto, no la retención.
      max-stream-length: 100000
      max-dlq-length: 10000
      trim-interval: PT5M
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: ${WORKER_CONCURRENCY:4}
    poll-timeout: 2s
  ratelimit:
    free:
      requests-per-minute: 20
    premium:
      requests-per-minute: 300
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    timeout: 120s
    # mock => no requiere Ollama corriendo; ollama => inference real
    adapter: ${MODEL_ADAPTER:mock}

logging:
  level:
    com.inferqueue: INFO
