server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index es lo que apunta al bundle de cada build: si el navegador lo guarda,
    # sigue cargando el JS viejo aunque el contenedor ya sirva el nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los bundles llevan el hash del contenido en el nombre: un cambio es otro archivo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /v1/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # El WebSocket necesita el upgrade explícito y un read timeout largo:
    # una conexión ociosa no debe cortarse mientras espera eventos de jobs.
    location /ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
