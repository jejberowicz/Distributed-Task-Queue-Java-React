# Service headless: los StatefulSet necesitan uno para darle identidad DNS estable
# a cada pod (postgres-0.postgres). Con una sola réplica alcanzaría un Service
# normal, pero el día que haya réplica de lectura el nombre ya está.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inferqueue
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: inferqueue
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inferqueue
            - name: POSTGRES_USER
              value: inferqueue
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inferqueue-secrets
                  key: POSTGRES_PASSWORD
            # El PVC se monta en el directorio padre y llega con un lost+found que
            # initdb rechaza. Por eso los datos van en un subdirectorio.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inferqueue"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "inferqueue"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
