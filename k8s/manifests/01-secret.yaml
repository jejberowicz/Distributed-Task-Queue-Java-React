# Secret de desarrollo, versionado a propósito para que el cluster levante con un
# solo `apply`. En cualquier cosa que no sea local esto va fuera del repo: Sealed
# Secrets, External Secrets Operator o el store del proveedor. Lo que importa acá
# es la separación — la contraseña y el token de admin nunca viven en el manifiesto
# del Deployment, sólo se referencian por `secretKeyRef`.
apiVersion: v1
kind: Secret
metadata:
  name: inferqueue-secrets
  namespace: inferqueue
type: Opaque
stringData:
  POSTGRES_PASSWORD: inferqueue
  ADMIN_TOKEN: dev-admin-token
